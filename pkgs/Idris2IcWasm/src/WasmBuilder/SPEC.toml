# WasmBuilder Specification
# Idris2 → IC WASM build pipeline

[definitions]
prefix = "REQ_WASM"

[[spec_area]]
name = "RefC Compilation"

[[spec]]
id = "${prefix}_REFC_001"
title = "Compile Idris2 to C via RefC backend"
invariant = "idris2 --codegen refc produces valid C file"

[[spec]]
id = "${prefix}_REFC_002"
title = "Handle package dependencies"
invariant = "-p flags passed correctly to idris2"

[[spec]]
id = "${prefix}_REFC_003"
title = "No generated C is a named failure, never another file"
invariant = "The generated-C lookup runs ls only on files find returned (find -exec ls -t {} +), so with no C it returns nothing and the build fails with \"No C file generated by RefC\"; ipkgNoCodegenReason names an ipkg that declares no `main =` or no `executable =` (a library ipkg generates no code), and that reason is appended to the failure; an ipkg declaring both gives Nothing. test-evidence: test_REQ_WASM_REFC_003"

[[spec_area]]
name = "Runtime Preparation"

[[spec]]
id = "${prefix}_RT_001"
title = "Download RefC runtime sources"
invariant = "Runtime files come from the local fork (support/refc and support/c); only files still missing are fetched, from a pinned fork commit (REQ_WASM_RT_004)"

[[spec]]
id = "${prefix}_RT_002"
title = "Download mini-gmp"
invariant = "mini-gmp.c/h fetched from gmplib when not cached"

[[spec]]
id = "${prefix}_RT_003"
title = "Create gmp.h wrapper"
invariant = "gmp.h provides mpz_inits/mpz_clears wrappers"

[[spec]]
id = "${prefix}_RT_004"
title = "RefC runtime is fetched from a pinned fork commit, file by file"
invariant = "refcRawUrl builds raw.githubusercontent.com/<refcPinnedRepo>/<refcPinnedRef>/support/<subdir>/<file> (overridable by IDRIS2_ICWASM_REFC_REPO / IDRIS2_ICWASM_REFC_REF) and never names master; refcRuntimeFiles lists the refc files the build compiles or force-includes, pathcov.c and pathcov.h included, and the support/c files; prepareRefCRuntime fetches only the files the local fork copy lacks, with curl -f so an HTTP error fails the step, and checks mini-gmp separately so a missing mini-gmp never refetches RefC. test-evidence: test_REQ_WASM_RT_004"

[[spec_area]]
name = "Emscripten Compilation"

[[spec]]
id = "${prefix}_EMCC_001"
title = "Compile C to WASM"
invariant = "emcc produces standalone WASM with STANDALONE_WASM=1"

[[spec]]
id = "${prefix}_EMCC_002"
title = "Include IC0 support"
invariant = "canister_entry.c and ic0_stubs.c linked"

[[spec]]
id = "${prefix}_EMCC_003"
title = "Disable filesystem"
invariant = "FILESYSTEM=0 to avoid WASI imports"

[[spec_area]]
name = "WASI Stubbing"

[[spec]]
id = "${prefix}_WASI_001"
title = "Stub fd_close import"
invariant = "wasi_snapshot_preview1.fd_close replaced with stub returning 0"

[[spec]]
id = "${prefix}_WASI_002"
title = "Stub fd_write import"
invariant = "wasi_snapshot_preview1.fd_write replaced with stub returning 0"

[[spec]]
id = "${prefix}_WASI_003"
title = "Stub fd_seek import"
invariant = "wasi_snapshot_preview1.fd_seek replaced with stub returning 0"

[[spec]]
id = "${prefix}_WASI_004"
title = "Handle missing wabt gracefully"
invariant = "If wabt (wasm2wat/wat2wasm) unavailable, fall back to binaryen (wasm-dis/wasm-as -all, PATH or emsdk upstream/bin next to emcc); only when neither toolchain exists copy original WASM with a replica-rejection warning"

[[spec_area]]
name = "Build Pipeline"

[[spec]]
id = "${prefix}_BUILD_001"
title = "buildCanister executes all steps"
invariant = "RefC → Runtime → Emcc → WASI stub in sequence"

[[spec]]
id = "${prefix}_BUILD_002"
title = "Return stubbed WASM path on success"
invariant = "BuildSuccess contains path to *_stubbed.wasm"

[[spec]]
id = "${prefix}_BUILD_003"
title = "Return error message on failure"
invariant = "BuildError contains descriptive error from failed step"

[[spec]]
id = "${prefix}_BUILD_004"
title = "Auto-detect IC0 support location"
invariant = "buildCanisterAuto finds lib/ic0 or ../idris2-icwasm/support/ic0"

[[spec_area]]
name = "Canister Entry Points"

[[spec]]
id = "${prefix}_ENTRY_001"
title = "Endpoints are the argument-less IO exports of Main, whichever export keyword"
invariant = "exportedDeclarations reads a signature after a line that is `export` or `public export`; isEndpointType holds for a type that starts with IO and has no top-level arrow (hasTopLevelArrow ignores arrows inside parentheses); parseExportedFunctions keeps exactly the endpoints and nonEndpointExports the rest, which the build prints by name; when the RefC arity of an endpoint cannot be inferred the failure names those endpoints (exportsWithoutArity). test-evidence: test_REQ_WASM_ENTRY_001"

[[spec]]
id = "${prefix}_ENTRY_002"
title = "The canister ipkg is the one whose main is the --main module"
invariant = "mainModuleName maps a --main path to its module (src/Main.idr to Main, src/A/B.idr to A.B); ipkgMainOf reads an ipkg's `main =`; ipkgForMain picks, among the project's ipkgs, the one whose main is that module; when none does, the build keeps findIpkg's choice and prints a warning naming every ipkg and its main. test-evidence: test_REQ_WASM_ENTRY_002"
