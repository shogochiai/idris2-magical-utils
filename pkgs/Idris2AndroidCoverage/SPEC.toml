[definitions]
prefix = "REQ_ANDCOV"

[[spec_area]]
name = "Device UI Coverage"

[[spec]]
id = "${prefix}_001"
title = "Extract the View's observable testID surface"
invariant = "viewTestIDs returns every testID prop declared anywhere in a Node tree; this is exactly what uiautomator can observe on a real device."

[[spec]]
id = "${prefix}_002"
title = "GapZero when the scenario drives every declared element"
invariant = "deviceGapZero is True iff every testID the View declares is exercised by the DeviceScenario."

[[spec]]
id = "${prefix}_003"
title = "A skipped element is reported as a screen gap"
invariant = "uncoveredTestIDs names every declared testID no scenario step exercises; non-empty ⟺ not GapZero, mirroring parity-ti Missing paths."

[[spec]]
id = "${prefix}_004"
title = "A proof-TextView host has no observable surface"
invariant = "A hollow View (one text node, no testIDs) yields viewTestIDs == [] — the structural reason an acceptance hack cannot be driven on-device."

[[spec]]
id = "${prefix}_005"
title = "Coverage report mirrors parity-ti shape"
invariant = "deviceCoverage yields totalElements/coveredElements/missing so the android step4/parity layer can consume device coverage uniformly with path coverage."

[[spec]]
id = "${prefix}_006"
title = "Project exclusions use the dfx line format; a bare line is a function-name prefix"
invariant = "projectPatternOf reads `<exact|prefix|suffix|contains>:<fn> # reason` with the Coverage.Core.Exclusions matcher dfx uses, and a bare `<fn fragment> # reason` line as a PREFIX of the function name; blank and comment-only lines yield no pattern; a bare compiled name holding ':' stays one prefix."

[[spec]]
id = "${prefix}_007"
title = "Project-excluded paths are counted in paths_excluded and reported separately"
invariant = "pathCoverageWith removes ids whose function a project pattern matches from the denominator, adds them to paths_excluded (conservation: paths_total = denominator + excluded + unknown) and reports them as paths_excluded_project; with no patterns the result equals pathCoverage."

[[spec]]
id = "${prefix}_008"
title = "The device numerator is the union of the logcat stream and a final ring dump"
invariant = "run-device-pathcov.sh counts every IDRIS_PATHHIT id that either its streaming logcat reader or a `logcat -d -b main` dump of the (enlarged, then restored) ring holds, polling the union until stable, and prints how many ids only one reader saw; its single EXIT trap stops the stream reader and removes its files."

[[spec]]
id = "${prefix}_009"
title = "The harness hands --exclusions to device-pathcov and refuses a missing file"
invariant = "run-device-pathcov.sh --exclusions FILE passes FILE as device-pathcov's 4th argument (the report then carries exclusions_file and paths_excluded_project); a named FILE that does not exist exits 2 before any device I/O; device-pathcov given an unreadable named file exits nonzero instead of measuring without it."
