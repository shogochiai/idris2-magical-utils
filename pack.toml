# The Yul codegen driver shipped by pkgs/Idris2Evm. Declared HERE, not only in a
# machine-local ~/code/pack.toml, because until 2026-08-05 this name was bound
# nowhere a repository owned: the only binding lived in an untracked file, and it
# resolved `idris2-yul` to this package while a DIFFERENT codebase
# (git@github.com:shogochiai/idris2-yul.git) also declares `package idris2-yul`.
# `which idris2-yul` answered, `pack install-app idris2-yul` succeeded, and the
# binary accepted the flags — every surface said "the tool is here" and none of
# them said "the tool is the one you mean". Owning the binding does not resolve
# that collision, but it makes it reviewable and reproducible instead of
# per-machine folklore.
[custom.all.idris2-yul]
type = "local"
path = "pkgs/Idris2Evm"
ipkg = "idris2-yul.ipkg"

# The bytecode interpreter, split out of idris2-evm so it stops being compiled
# into every consumer of the contract library that has no use for it. Declaring
# it HERE (tracked, relative path) is what makes the split possible at all: the
# attempt on 2026-08-05 was reverted because the only place to put a new name
# was the untracked ~/code/pack.toml, which would have made this repo build on
# one machine and nowhere else. See 00d99e48.
[custom.all.idris2-evm-interp]
type = "local"
path = "pkgs/Idris2Evm"
ipkg = "idris2-evm-interp.ipkg"
